name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Pages site (workflow source) via PAT
        env:
          PAT: ${{ secrets.PAT_PAGES }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          # Try POST (create). If it exists already, POST returns 4xx — fall through to PUT.
          POST_CODE=$(curl -sS -o /tmp/post.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $PAT" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/pages" \
            -d '{"build_type":"workflow"}')
          echo "POST /pages → HTTP $POST_CODE"
          cat /tmp/post.json; echo

          # PUT to ensure build_type=workflow even if site already existed
          PUT_CODE=$(curl -sS -o /tmp/put.json -w "%{http_code}" \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $PAT" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/pages" \
            -d '{"build_type":"workflow"}')
          echo "PUT /pages → HTTP $PUT_CODE"
          cat /tmp/put.json; echo

          # Fail the step if neither attempt left Pages in a usable state
          if [ "$POST_CODE" -ge 400 ] && [ "$PUT_CODE" -ge 400 ]; then
            echo "Pages enable failed."
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
